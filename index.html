<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shsh 초단편</title>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/fonts.v1.js" data-app="shsh"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#d1b6ad"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="shsh">
<script src="https://jjojjolonglong-sudo.github.io/mnmn/config.js"></script>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/core.v1.js" data-app="shsh"></script>
<script src="https://jjojjolonglong-sudo.github.io/mnmn/pick.v1.js"></script>
<style>
/* 테마: 'Club Heartbreak' 포스터 — 회색기 핑크 벽에 붙은 연두빛 미색 포스터, 파란 잉크와 선, 코랄 핑크 하트.
   키치 포인트는 세 가지만: 포스터식 파란 테두리 칸, 코랄 딱딱한 그림자, 살짝 기울어진 스티커 태그 */
:root{--wall:#d1b6ad;--paper:#e9e6cf;--card:#f4f2e3;--blue:#2a60c6;--ink:#1c3a80;--mut:#7584ad;--ln:rgba(42,96,198,.26);--coral:#ef7f86;--pale:#f8dcd8;--top:56px;--hd:46px;--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16 0 0 0 0 .38 0 0 0 0 .78 0 0 0 .1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
[hidden]{display:none!important}
*{box-sizing:border-box;border-radius:0}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--wall);color:var(--ink);font:14px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);padding:6px 9px;min-width:0}
button{cursor:pointer;white-space:nowrap;line-height:1.3}
input,select{width:100%;border-color:rgba(42,96,198,.45)}
input:focus,select:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--coral);outline-offset:-1px}
label{display:block;font-size:12px;font-weight:700;color:var(--blue);margin:16px 0 5px;letter-spacing:.02em}
.mut{color:var(--mut)}
/* 버튼: 파란 테두리 / 주 버튼은 파란 바탕+코랄 그림자 / 추가는 코랄 스티커 */
.bt{border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:600}
@media(hover:hover){.bt:hover{background:var(--blue);color:var(--paper)}}
.pri{background:var(--blue);color:var(--paper);border:1.5px solid var(--blue);font-weight:800;box-shadow:3px 3px 0 var(--coral)}
.pri:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--coral)}
.pri:disabled{opacity:.5;cursor:default}
.add{background:var(--coral);color:var(--ink);border:1.5px solid var(--blue);font-weight:800;box-shadow:2px 2px 0 var(--blue)}
.add:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--blue)}
.icb{width:32px;height:32px;padding:0;display:grid;place-items:center}
.icb svg{width:17px;height:17px;display:block}

/* 포스터 한 장 (가운데 960px) */
#app{max-width:960px;margin:16px auto;height:calc(100vh - 32px);height:calc(100dvh - 32px);display:flex;flex-direction:column;border:2px solid var(--blue);box-shadow:8px 8px 0 var(--coral);
 background:var(--paper) var(--grain)}
@media(max-width:1000px) and (min-width:721px){#app{margin:12px;height:calc(100dvh - 24px);box-shadow:5px 5px 0 var(--coral)}}
.top{flex:none;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0 18px;display:flex;align-items:center;gap:9px;border-bottom:4px double var(--blue)}
.logo{font:900 27px/1 'Arial Black','Helvetica Neue',system-ui,sans-serif;letter-spacing:.03em;color:transparent;-webkit-text-stroke:1.3px var(--blue)}
.hrt{width:20px;height:20px;flex:none;display:block}
.sub{font:700 15px/1 Georgia,'Times New Roman',serif;color:var(--blue);transform:scaleY(1.3);letter-spacing:-.01em;white-space:nowrap}
.sp{flex:1}
.tb{display:flex;gap:6px}
.tb button{height:32px;padding:0 10px;font-size:13px}
.tb .icb{font-size:16px;width:32px;padding:0}

/* 작품 | 태그 (각자 스크롤) */
#grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.pane{min-height:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1.5px solid var(--blue)}
.ph{flex:none;height:var(--hd);display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1.5px solid var(--blue)}
.ph h2{margin:0;font-size:15px;font-weight:800;color:var(--blue)}
.ph .n{font-size:11.5px;font-weight:800;color:var(--ink);background:var(--coral);padding:0 7px;line-height:19px;border-radius:999px;font-variant-numeric:tabular-nums}
.ph .flt{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--ink);background:var(--pale);border:1px solid var(--coral);border-radius:999px;padding:0 0 0 9px;height:24px;max-width:150px}
.ph .flt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .flt button{border:0;background:none;color:var(--ink);padding:0 8px;height:22px}
.seg{display:flex}.seg button{height:28px;padding:0 10px;font-size:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:600}.seg button+button{margin-left:-1.5px}
.seg button.on{background:var(--blue);color:var(--paper)}
.ph .add{height:28px;padding:0 11px;font-size:12px}
.pb{flex:1;min-height:0;overflow:auto;overscroll-behavior:none}
.emp{color:var(--mut);padding:34px 16px;text-align:center;font-size:13px;line-height:1.7}
.emp svg{width:44px;height:44px;display:block;margin:0 auto 10px}

/* 작품 — 표 (포스터의 파란 칸) */
.wr{display:grid;grid-template-columns:82px minmax(0,1fr) 50px minmax(0,1fr);align-items:baseline;gap:0 10px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.wr.hd{position:sticky;top:0;z-index:1;background:var(--paper) var(--grain);cursor:default;padding-top:6px;padding-bottom:6px;font-size:11.5px;font-weight:700;color:var(--blue);border-bottom:1.5px solid var(--blue)}
@media(hover:hover){.wr:not(.hd):hover{background:rgba(255,255,255,.42)}}
.wr .d{font-size:12.5px;color:var(--blue);font-variant-numeric:tabular-nums}
.wr .t{font-weight:700;overflow-wrap:anywhere}
.wr .t small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:1px}
.wr .l{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px 3px}
.chip{font-size:11.5px;line-height:18px;padding:0 8px;border:1px solid var(--coral);background:var(--pale);color:var(--ink);border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-block}
.chip.on{background:var(--coral);border-color:var(--blue);font-weight:700}
@media(hover:hover){.chip:hover{border-color:var(--blue)}}
/* 작품 — 블록 (작은 포스터 카드) */
.wb{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px 12px;padding:14px 16px 18px}
.wc{background:var(--card);border:1.5px solid var(--blue);box-shadow:3px 3px 0 var(--coral);padding:9px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px}
@media(hover:hover){.wc:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--coral)}}
.wc .t{font-weight:800;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.wc .a{font-size:12px;color:var(--mut)}
.wc .m{font-size:12px;color:var(--blue);font-variant-numeric:tabular-nums}
.wc .chips{margin-top:auto;padding-top:6px}

/* 태그 — 표 */
.tr{display:grid;grid-template-columns:minmax(0,.9fr) 26px minmax(0,1.5fr);align-items:baseline;gap:0 8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--ln)}
.tr.hd{position:sticky;top:0;z-index:1;background:var(--paper) var(--grain);padding-top:6px;padding-bottom:6px;font-size:11.5px;font-weight:700;color:var(--blue);border-bottom:1.5px solid var(--blue)}
.nm{font-weight:800;cursor:pointer;overflow-wrap:anywhere;text-align:left;border:0;background:none;padding:0;color:var(--ink)}
.nm.on{color:var(--blue);text-decoration:underline 2px var(--coral);text-underline-offset:3px}
.tr .c{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--blue);font-weight:700}
.tr .ws{font-size:12px;color:var(--mut);line-height:1.55}
.wl{cursor:pointer}
@media(hover:hover){.wl:hover{color:var(--blue);text-decoration:underline}}
.ed{border:0;background:none;padding:0 2px;color:var(--mut);font-size:12px;cursor:pointer}
@media(hover:hover){.ed:hover{color:var(--blue)}}
/* 태그 — 블록 (코랄 머리띠 카드) */
.tbk{padding:14px 16px 18px;display:flex;flex-direction:column;gap:13px}
.tb2{background:var(--card);border:1.5px solid var(--blue);box-shadow:3px 3px 0 var(--blue)}
.tb2 .h{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;background:var(--coral);border-bottom:1.5px solid var(--blue)}
.tb2 .h .nm{flex:1;min-width:0}
.tb2 .h .c{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.tb2 .h .ed{color:var(--ink)}
.tb2 .h.ing{background:var(--card);padding:6px 8px}
.tb2.on .h{background:var(--blue)}.tb2.on .h,.tb2.on .h .nm,.tb2.on .h .ed{color:var(--paper)}.tb2.on .nm.on{text-decoration:none}
.tb2 ul{list-style:none;margin:0;padding:6px 10px 7px}
.tb2 li{font-size:12.5px;display:flex;gap:8px;padding:2px 0}
.tb2 li .wl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb2 li small{color:var(--blue);font-variant-numeric:tabular-nums}
.tb2 .z{font-size:12px;color:var(--mut);padding:7px 10px}
/* 태그 이름 고치기·새 태그 줄 */
.tedit{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
.tedit input{height:28px;padding:2px 7px;background:var(--card)}
.tedit button{height:28px;padding:0 9px;font-size:12px;flex:none}
.tedit .icb{width:28px;height:28px;flex:none}.tedit .icb svg{width:15px;height:15px}
.tr .tedit{grid-column:1/4}
.nt{display:flex;gap:6px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--ln)}
.nt input{height:30px;padding:3px 8px}
.nt button{height:30px;padding:0 10px;font-size:12px}

/* 작품 등록·수정 (작품 영역 안) */
.ef{padding:4px 16px 20px}
.ef input.ti{font-size:20px;font-weight:800;border:0;border-bottom:2px solid var(--blue);padding:8px 2px 6px;background:none;margin-top:10px;color:var(--ink)}
.ef input.ti::placeholder{color:var(--mut);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ef .pk-in,.ef input:not(.ti),.ef select{height:36px}
.lw{position:relative}.lw input{padding-right:42px}.lw span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);pointer-events:none}
.pf{flex:none;display:flex;gap:10px;padding:11px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--blue)}
.pf button{flex:1;height:40px;font-size:14px}
.ph .icb{margin-right:-2px}
/* 태그 고르기: 타이핑 → 걸러진 목록(↑↓), 엔터 → 골라진 것 / 같은 이름 / 없으면 새 태그(저장할 때 만들어짐) */
.ti2{position:relative}
.tbx{display:flex;flex-wrap:wrap;gap:5px 4px;align-items:center;background:var(--card);border:1px solid rgba(42,96,198,.45);padding:6px 7px;min-height:40px;cursor:text}
.tbx:focus-within{border-color:var(--blue)}
.tbx .chip{cursor:default;display:inline-flex;align-items:center;padding-right:0;line-height:22px}
.tbx .chip.nw{border-style:dashed;background:var(--card)}
.tbx .chip button{border:0;background:none;color:var(--ink);padding:0 7px 0 4px;line-height:20px;font-size:13px}
.ef .tbx input{border:0;background:none;padding:2px 3px;flex:1;min-width:90px;width:auto;height:auto}
.tbx input:focus-visible{outline:0}
.tls,.pk-ls{background:var(--card)!important;color:var(--ink)!important;border:1.5px solid var(--blue)!important;box-shadow:3px 3px 0 var(--coral)!important}
.tls{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:3;max-height:220px;overflow:auto}
.tls div{padding:6px 9px;font-size:13px;display:flex;gap:8px;cursor:pointer}
.tls div small{margin-left:auto;color:var(--mut)}
.tls div.hi,.pk-ls div.on{background:var(--pale)!important}
.tls div.new,.pk-ls .pk-nw{color:var(--blue)!important;font-weight:700}
.pk-ls .pk-nw{border-top-color:var(--ln)!important}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px}

/* 휴대폰: 위아래로 쌓고 페이지 전체 스크롤 */
@media(max-width:720px){
 #app{margin:0;height:auto;min-height:100dvh;border:0;box-shadow:none}
 .top{position:sticky;top:0;z-index:5;background:var(--paper) var(--grain);padding-left:14px}
 .sub{display:none}
 #grid{display:block;padding-bottom:calc(52px + env(safe-area-inset-bottom,0px))}
 .pane+.pane{border-left:0;border-top:4px double var(--blue);margin-top:22px}
 .pb{overflow:visible}
 .ph{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:4;background:var(--paper) var(--grain);padding-left:14px}
 .wr.hd,.tr.hd{top:calc(var(--top) + var(--hd) + env(safe-area-inset-top,0px))}
 .wr{grid-template-columns:72px minmax(0,1fr) 44px;padding-left:14px}
 .wr .tg{grid-column:2/4;margin-top:5px}.wr.hd .tg,.wr .tg:empty{display:none}
 .wb{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));padding-left:14px}
 .tr,.nt,.tbk,.ef{padding-left:14px}
 .pf{position:sticky;bottom:0;background:var(--paper) var(--grain);z-index:4}
}

#login{max-width:340px;margin:16vh auto 0;padding:26px 22px 22px;background:var(--paper);border:2px solid var(--blue);box-shadow:8px 8px 0 var(--coral)}
#login .lg{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}#login .logo{font-size:34px}
#login .pri{margin-top:18px;width:100%;height:40px}
#lmsg{color:#c23b47;font-size:13px;min-height:18px;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blue);color:var(--paper);border:1.5px solid var(--blue);box-shadow:3px 3px 0 var(--coral);padding:8px 14px;font-size:13px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style></head><body>
<div id="login" hidden><div class="lg"><span class="logo">SHSH</span><svg class="hrt" viewBox="0 0 24 24"><use href="#ht"/></svg></div><p class="mut" style="text-align:center;margin:0 0 6px">초단편 컨셉 정리</p><label>이메일</label><input id="lem" type="email" autocomplete="username"><label>비밀번호</label><input id="lpw" type="password" autocomplete="current-password"><button class="pri" id="go">로그인</button><p id="lmsg"></p></div>
<div id="app" hidden>
<header class="top"><span class="logo">SHSH</span><svg class="hrt" viewBox="0 0 24 24" aria-hidden="true"><use href="#ht"/></svg><span class="sub">SHORT SHORT</span><span class="sp"></span>
 <div class="tb"><button class="bt" id="inst" hidden>설치</button><button class="bt" id="out">로그아웃</button><button class="bt icb" id="rld" title="새로고침" aria-label="새로고침">↻</button></div></header>
<div id="grid">
 <section class="pane" id="pw"><div class="ph" id="wph"></div><div class="pb" id="wb"></div><div class="pb" id="we" hidden></div><div class="pf" id="wpf" hidden><button class="bt" data-a="cancel">취소</button><button class="pri" data-a="save">저장</button></div></section>
 <section class="pane" id="pt"><div class="ph"><h2>태그</h2><span class="n" id="tn"></span><span class="sp"></span><div class="seg" data-v="t"><button data-m="t">표</button><button data-m="b">블록</button></div><button class="add" id="addT">+ 태그</button></div><div class="pb" id="tb"></div></section>
</div>
</div>
<div id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="ht" viewBox="0 0 24 24"><path d="M12 21.2s-7.6-4.6-10-9.4C.3 8.4 2.3 3.8 6.3 3.8c2.3 0 4 1.3 5.7 3.5 1.7-2.2 3.4-3.5 5.7-3.5 4 0 6 4.6 4.3 8C19.6 16.6 12 21.2 12 21.2z" fill="#ef7f86" stroke="#2a60c6" stroke-width="1.1"/><path d="M12 7.3l-1.5 3.1 2.5 2.1-2.1 2.9 1.5 2.3-.4 3.5" fill="none" stroke="#e9e6cf" stroke-width="1.5" stroke-linejoin="bevel"/></symbol>
 <symbol id="trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.2 6.5l.9 13.5h9.8l.9-13.5M10 10v6.5M14 10v6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/></symbol>
</svg>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSV='shsh:view';
const S={works:[],tags:[],refs:[],wt:new Map(),ft:null,view:{w:'t',t:'b'},ed:null,et:null,newT:false,wy:0};
try{Object.assign(S.view,JSON.parse(localStorage.getItem(LSV)||'{}'))}catch(e){}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
const uid=()=>Core.ses()?.user?.id;
const q=(p,o)=>Core.rest(p,o);
const ins=(t,row)=>q(t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(Object.assign({user_id:uid()},row))}).then(r=>r[0]);
const trashSvg='<svg aria-hidden="true"><use href="#trash"/></svg>';
const heartSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ht"/></svg>';
const narrow=()=>matchMedia('(max-width:720px)').matches;
const fmtD=d=>d?d.replace(/-/g,'.'):'';
const fmtL=n=>n==null||n===''?'':String(+n);                /* 만자 단위: 1.2 → "1.2" */
const tById=id=>S.tags.find(t=>t.id===id);
const wById=id=>S.works.find(w=>w.id===id);
const rName=id=>S.refs.find(r=>r.id===id)?.name||'';
const byWho=w=>[rName(w.author_id),rName(w.publisher_id)].filter(Boolean).join(' · ');
function cnt(t){let n=0;S.wt.forEach(s=>{if(s.has(t.id))n++});return n}
const tagsOf=w=>[...(S.wt.get(w.id)||[])].map(tById).filter(Boolean).sort((a,b)=>cnt(b)-cnt(a)||a.name.localeCompare(b.name,'ko'));
const worksOf=t=>sortW(S.works.filter(w=>S.wt.get(w.id)?.has(t.id)));
/* 작품: 출간일 최신순(출간일 없는 작품은 맨 위), 같으면 늦게 넣은 것 위 */
function sortW(a){return a.slice().sort((x,y)=>{if(!x.pub_date!==!y.pub_date)return x.pub_date?1:-1;if(x.pub_date!==y.pub_date)return x.pub_date<y.pub_date?1:-1;return x.created_at<y.created_at?1:-1})}
/* 태그: 작품 수 많은 순, 같으면 가나다 */
function sortT(){const c=new Map(S.tags.map(t=>[t.id,cnt(t)]));return S.tags.slice().sort((a,b)=>c.get(b.id)-c.get(a.id)||a.name.localeCompare(b.name,'ko'))}
/* 스티커 태그는 태그마다 정해진 만큼 살짝 기울어짐(-1.5~1.5도) */
function tilt(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return ((Math.abs(h)%7)-3)*.5}
const chip=t=>`<span class="chip${S.ft===t.id?' on':''}" data-ft="${t.id}" style="transform:rotate(${tilt(t.id)}deg)">${E(t.name)}</span>`;

/* ---------- 불러오기 ---------- */
async function load(){const [w,t,l,r]=await Promise.all([q('shsh_work?select=*'),q('shsh_tag?select=*'),q('shsh_work_tag?select=work_id,tag_id'),q('shsh_ref?select=*&order=name')]);
 S.works=w;S.tags=t;S.refs=r;S.wt=new Map();l.forEach(x=>{if(!S.wt.has(x.work_id))S.wt.set(x.work_id,new Set());S.wt.get(x.work_id).add(x.tag_id)});R()}

/* ---------- 화면 (다시 그려도 각 영역 스크롤 위치 그대로) ---------- */
function R(){const a=$('#wb').scrollTop,b=$('#tb').scrollTop;RW();RT();if(!S.ed)$('#wb').scrollTop=a;$('#tb').scrollTop=b}
function segOn(){document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===S.view[s.dataset.v])))}
function RW(){const ph=$('#wph');
 if(S.ed){ph.innerHTML=`<h2>${S.ed.id?'작품 수정':'새 작품'}</h2><span class="sp"></span>${S.ed.id?`<button class="bt icb" data-a="rm" title="작품 삭제" aria-label="작품 삭제">${trashSvg}</button>`:''}`;return}
 const ft=S.ft&&tById(S.ft);if(S.ft&&!ft)S.ft=null;
 const L=sortW(ft?S.works.filter(w=>S.wt.get(w.id)?.has(ft.id)):S.works);
 ph.innerHTML=`<h2>작품</h2><span class="n">${ft?`${L.length}/${S.works.length}`:S.works.length}</span>${ft?`<span class="flt" title="${E(ft.name)}"><span>#${E(ft.name)}</span><button data-a="unf" aria-label="태그 거르기 풀기">×</button></span>`:''}<span class="sp"></span><div class="seg" data-v="w"><button data-m="t">표</button><button data-m="b">블록</button></div><button class="add" data-a="new">+ 작품</button>`;
 segOn();
 const b=$('#wb');
 if(!S.works.length){b.innerHTML=`<div class="emp">${heartSvg}아직 작품이 없어요.<br>「+ 작품」으로 시작해요.</div>`;return}
 const tt=w=>E(w.title)||'<span class="mut">(제목 없음)</span>';
 if(S.view.w==='t')b.innerHTML=`<div class="wr hd"><span>출간일</span><span>제목</span><span class="l">만자</span><span class="tg">태그</span></div>`+L.map(w=>{const by=byWho(w);return `<div class="wr" data-w="${w.id}"><span class="d">${fmtD(w.pub_date)||'—'}</span><span class="t">${tt(w)}${by?`<small>${E(by)}</small>`:''}</span><span class="l">${fmtL(w.length)}</span><span class="tg chips">${tagsOf(w).map(chip).join('')}</span></div>`}).join('');
 else b.innerHTML=`<div class="wb">`+L.map(w=>{const by=byWho(w);return `<div class="wc" data-w="${w.id}"><span class="t">${tt(w)}</span>${by?`<span class="a">${E(by)}</span>`:''}<span class="m">${fmtD(w.pub_date)||'출간일 없음'}${w.length!=null?' · '+fmtL(w.length)+'만자':''}</span><span class="chips">${tagsOf(w).map(chip).join('')}</span></div>`}).join('')+`</div>`}
function RT(){const T=sortT(),b=$('#tb');$('#tn').textContent=S.tags.length;segOn();
 const nt=S.newT?`<div class="nt"><input id="ntin" placeholder="새 태그 이름" autocomplete="off"><button class="bt" data-a="ntx">취소</button><button class="pri" data-a="ntok">추가</button></div>`:'';
 if(!S.tags.length){b.innerHTML=nt+`<div class="emp">${heartSvg}아직 태그가 없어요.<br>작품을 쓸 때 태그를 치고 엔터를 누르면 생겨요.</div>`;return}
 const ted=t=>`<span class="tedit"><input id="tein" value="${E(t.name)}" autocomplete="off"><button class="bt icb" data-a="trm" title="태그 삭제" aria-label="태그 삭제">${trashSvg}</button><button class="bt" data-a="tx">취소</button><button class="pri" data-a="tok">저장</button></span>`;
 const ttl=w=>E(w.title||'(제목 없음)');
 if(S.view.t==='t')b.innerHTML=nt+`<div class="tr hd"><span>태그</span><span style="text-align:right">수</span><span>작품</span></div>`+T.map(t=>{const W=worksOf(t);
   if(S.et===t.id)return `<div class="tr">${ted(t)}</div>`;
   return `<div class="tr"><span><button class="nm${S.ft===t.id?' on':''}" data-ft="${t.id}">${E(t.name)}</button> <button class="ed" data-et="${t.id}" title="태그 고치기" aria-label="태그 고치기">✎</button></span><span class="c">${W.length}</span><span class="ws">${W.map(w=>`<span class="wl" data-w="${w.id}">${ttl(w)}</span>`).join(' · ')||'—'}</span></div>`}).join('');
 else b.innerHTML=nt+`<div class="tbk">`+T.map(t=>{const W=worksOf(t);
   const head=S.et===t.id?`<div class="h ing">${ted(t)}</div>`:`<div class="h"><button class="nm${S.ft===t.id?' on':''}" data-ft="${t.id}">${E(t.name)}</button><span class="c">${W.length}</span><button class="ed" data-et="${t.id}" title="태그 고치기" aria-label="태그 고치기">✎</button></div>`;
   return `<div class="tb2${S.ft===t.id&&S.et!==t.id?' on':''}">${head}${W.length?`<ul>${W.map(w=>`<li><span class="wl" data-w="${w.id}">${ttl(w)}</span><small>${fmtD(w.pub_date)}</small></li>`).join('')}</ul>`:'<div class="z">이 태그를 단 작품이 없어요</div>'}</div>`}).join('')+`</div>`;
 const ti=$('#tein');if(ti&&document.activeElement!==ti){ti.focus();ti.select()}}

/* ---------- 누르기 ---------- */
$('#grid').addEventListener('click',async e=>{const t=e.target;
 const sg=t.closest('.seg [data-m]');if(sg){S.view[sg.parentNode.dataset.v]=sg.dataset.m;try{localStorage.setItem(LSV,JSON.stringify(S.view))}catch(x){}R();return}
 if(t.closest('#we'))return;
 const f=t.closest('[data-ft]');if(f){S.ft=S.ft===f.dataset.ft?null:f.dataset.ft;if(S.ed)RT();else R();return}
 const et=t.closest('[data-et]');if(et){S.et=et.dataset.et;S.newT=false;RT();return}
 const w=t.closest('[data-w]');if(w){openEd(w.dataset.w);return}
 const a=t.closest('[data-a]')?.dataset.a;if(!a)return;
 if(a==='unf'){S.ft=null;R()}
 if(a==='new')openEd(null);
 if(a==='cancel')closeEd();
 if(a==='save')saveEd();
 if(a==='rm')delWork();
 if(a==='ntx'){S.newT=false;RT()}
 if(a==='ntok')addTagFromRow();
 if(a==='tx'){S.et=null;RT()}
 if(a==='tok')saveTagName();
 if(a==='trm')delTag();
});
$('#grid').addEventListener('keydown',e=>{if(e.isComposing)return;
 if(e.target.id==='ntin'){if(e.key==='Enter'){e.preventDefault();addTagFromRow()}if(e.key==='Escape'){S.newT=false;RT()}}
 if(e.target.id==='tein'){if(e.key==='Enter'){e.preventDefault();saveTagName()}if(e.key==='Escape'){S.et=null;RT()}}});
$('#addT').onclick=()=>{S.newT=true;S.et=null;RT();$('#ntin')?.focus()};
async function addTagFromRow(){const i=$('#ntin'),n=i.value.trim();if(!n)return;
 if(S.tags.some(t=>t.name.toLowerCase()===n.toLowerCase())){toast('이미 있는 태그예요');i.select();return}
 try{const r=await ins('shsh_tag',{name:n});S.tags.push(r);RT();const j=$('#ntin');j&&j.focus()}catch(x){toast('만들지 못했어요: '+x.message)}}
async function saveTagName(){const t=tById(S.et),v=$('#tein').value.trim();if(!t)return;
 if(!v){toast('이름을 입력해 주세요');return}
 if(v!==t.name){if(S.tags.some(x=>x.id!==t.id&&x.name.toLowerCase()===v.toLowerCase())){toast('같은 이름의 태그가 이미 있어요');return}
  try{await q('shsh_tag?id=eq.'+t.id,{method:'PATCH',body:JSON.stringify({name:v,updated_at:new Date().toISOString()})});t.name=v}catch(x){toast('저장하지 못했어요: '+x.message);return}}
 S.et=null;R();if(S.ed)drawTbx()}
async function delTag(){const t=tById(S.et);if(!t)return;const n=cnt(t);
 if(!confirm(`태그 「${t.name}」을 지울까요?${n?`\n작품 ${n}개에서 이 태그가 빠져요(작품은 그대로).`:''}`))return;
 try{await q('shsh_tag?id=eq.'+t.id,{method:'DELETE'});S.tags=S.tags.filter(x=>x.id!==t.id);S.wt.forEach(s=>s.delete(t.id));if(S.ft===t.id)S.ft=null;
  if(S.ed){S.ed.tags=S.ed.tags.filter(x=>x!==t.id);S.ed.orig=edSnap(readEd())}S.et=null;R();if(S.ed)drawTbx()}catch(x){toast('지우지 못했어요: '+x.message)}}

/* ---------- 작품 등록·수정 (작품 영역 안, 취소하면 아무것도 저장 안 됨) ---------- */
/* S.ed = 고치는 중인 사본. tags 안의 {n:이름}은 저장할 때 새로 만들 태그, 작가·출판사의 'new:이름'도 저장할 때 만들어요 */
const edSnap=d=>JSON.stringify([d.title,d.pub_date,d.length,d.author_id,d.publisher_id,d.tags.map(x=>x.n?'+'+x.n:x)]);
function readEd(){const d=S.ed,f=$('#we');if(!d||!f.querySelector('.ti'))return d;
 d.title=f.querySelector('.ti').value;d.pub_date=f.querySelector('[data-f=pub_date]').value||null;d.length=f.querySelector('[data-f=length]').value;
 d.author_id=f.querySelector('#eA').value||null;d.publisher_id=f.querySelector('#eP').value||null;return d}
const dirty=()=>!!S.ed&&edSnap(readEd())!==S.ed.orig;
function openEd(id){if(S.ed&&S.ed.id===id&&id)return;
 if(dirty()&&!confirm('저장하지 않은 내용이 있어요. 버리고 넘어갈까요?'))return;
 const w=id?wById(id):null;if(id&&!w)return;
 if(!S.ed)S.wy=narrow()?scrollY:$('#wb').scrollTop;
 S.ed={id:w?w.id:null,title:w?w.title:'',pub_date:w?w.pub_date:null,length:w&&w.length!=null?fmtL(w.length):'',author_id:w?w.author_id:null,publisher_id:w?w.publisher_id:null,
  tags:w?tagsOf(w).map(t=>t.id):(S.ft?[S.ft]:[])};S.ed.orig=edSnap(S.ed);S.et=null;
 $('#wb').hidden=true;$('#we').hidden=false;$('#wpf').hidden=false;RW();drawEd();
 $('#we').scrollTop=0;if(narrow())scrollTo(0,$('#pw').getBoundingClientRect().top+scrollY-$('.top').offsetHeight);
 if(!id)setTimeout(()=>$('#we .ti')?.focus(),20)}
function closeEd(){S.ed=null;$('#we').hidden=true;$('#we').innerHTML='';$('#wpf').hidden=true;$('#wb').hidden=false;R();
 if(narrow())scrollTo(0,S.wy);else $('#wb').scrollTop=S.wy}
function refOpts(type){return '<option value="">없음</option>'+S.refs.filter(r=>r.type===type).map(r=>`<option value="${r.id}">${E(r.name)}</option>`).join('')}
function drawEd(){const d=S.ed,f=$('#we');
 f.innerHTML=`<div class="ef">
  <input class="ti" value="${E(d.title)}" placeholder="제목" autocomplete="off">
  <div class="g2"><div><label>작가</label><select id="eA">${refOpts('author')}</select></div><div><label>출판사</label><select id="eP">${refOpts('publisher')}</select></div></div>
  <div class="g2"><div><label>출간일</label><input type="date" data-f="pub_date" value="${d.pub_date||''}" min="1900-01-01" max="9999-12-31"></div>
  <div><label>분량</label><div class="lw"><input data-f="length" inputmode="decimal" value="${E(d.length)}" placeholder="0.0" autocomplete="off"><span>만자</span></div></div></div>
  <label>태그</label><div class="ti2"><div class="tbx" id="tbx"></div></div>
  <p class="hint">타이핑하면 목록이 걸러져요(↑↓). 엔터 → 골라진 태그. 없는 이름이면 새 태그(점선)가 되고, 저장할 때 만들어져요.</p></div>`;
 const a=f.querySelector('#eA'),p=f.querySelector('#eP');a.value=d.author_id||'';p.value=d.publisher_id||'';
 if(window.Pick){Pick.enhance(a,{placeholder:'작가',create:async n=>'new:'+n});Pick.enhance(p,{placeholder:'출판사',create:async n=>'new:'+n})}
 /* 분량: 숫자와 점 하나만, 소수 둘째 자리까지 */
 f.querySelector('[data-f=length]').addEventListener('input',e=>{let v=e.target.value.replace(/[^\d.]/g,'');const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,2);if(v!==e.target.value)e.target.value=v});
 drawTbx()}
async function delWork(){const d=S.ed,w=d&&wById(d.id);if(!w)return;
 if(!confirm(`「${w.title||'제목 없음'}」을 지울까요? 되돌릴 수 없어요.`))return;
 try{await q('shsh_work?id=eq.'+w.id,{method:'DELETE'});S.works=S.works.filter(x=>x.id!==w.id);S.wt.delete(w.id);closeEd();toast('지웠어요')}catch(x){toast('지우지 못했어요: '+x.message)}}
let saving=false;
async function saveEd(){if(saving)return;const d=readEd();const tin=$('#tin');if(tin&&tin.value.trim()){addDraftTag(tin.value.trim());tin.value=''}
 const title=(d.title||'').trim();if(!title){toast('제목을 입력해 주세요');$('#we .ti').focus();return}
 const len=d.length===''||d.length==='.'?null:Math.round(parseFloat(d.length)*100)/100;
 saving=true;const sb=document.querySelector('#wpf .pri');sb.disabled=true;sb.textContent='저장 중…';
 try{
  /* 새 작가·출판사 */
  const ref=async(v,type)=>{if(!v||!v.startsWith('new:'))return v||null;const n=v.slice(4).trim();
   let r=S.refs.find(x=>x.type===type&&x.name===n);if(!r){r=await ins('shsh_ref',{type,name:n});S.refs.push(r);S.refs.sort((a,b)=>a.name.localeCompare(b.name,'ko'))}return r.id};
  const author_id=await ref(d.author_id,'author'),publisher_id=await ref(d.publisher_id,'publisher');
  /* 새 태그 */
  const ids=[];for(const x of d.tags){if(typeof x==='string'){ids.push(x);continue}
   let t=S.tags.find(y=>y.name.toLowerCase()===x.n.toLowerCase());if(!t){t=await ins('shsh_tag',{name:x.n});S.tags.push(t)}ids.push(t.id)}
  /* 작품 */
  const row={title,pub_date:d.pub_date,length:len,author_id,publisher_id};let w;
  if(d.id){w=wById(d.id);await q('shsh_work?id=eq.'+d.id,{method:'PATCH',body:JSON.stringify(Object.assign({},row,{updated_at:new Date().toISOString()}))});Object.assign(w,row)}
  else{w=await ins('shsh_work',row);S.works.push(w)}
  /* 태그 연결: 늘어난 것은 넣고, 빠진 것은 지움 */
  const old=S.wt.get(w.id)||new Set(),nw=new Set(ids);
  const add=[...nw].filter(x=>!old.has(x)),rm=[...old].filter(x=>!nw.has(x));
  if(add.length)await q('shsh_work_tag',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(add.map(tag_id=>({work_id:w.id,tag_id,user_id:uid()})))});
  if(rm.length)await q(`shsh_work_tag?work_id=eq.${w.id}&tag_id=in.(${rm.join(',')})`,{method:'DELETE'});
  S.wt.set(w.id,nw);
  closeEd();toast('저장했어요')
 }catch(x){toast('저장하지 못했어요: '+x.message)}
 finally{saving=false;sb.disabled=false;sb.textContent='저장'}}
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});

/* 태그 고르기 칸 (사본만 바꿈) */
function addDraftTag(name){const d=S.ed,t=S.tags.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(t){if(!d.tags.includes(t.id))d.tags.push(t.id)}else if(!d.tags.some(x=>x.n&&x.n.toLowerCase()===name.toLowerCase()))d.tags.push({n:name})}
function drawTbx(){const box=$('#tbx'),d=S.ed;if(!box||!d)return;const keep=box.querySelector('input')?.value||'';
 d.tags=d.tags.filter(x=>typeof x!=='string'||tById(x));
 box.innerHTML=d.tags.map((x,i)=>{const t=typeof x==='string'?tById(x):null;
   return `<span class="chip${t?'':' nw'}" style="transform:rotate(${tilt(t?t.id:x.n)}deg)">${E(t?t.name:x.n)}<button data-ri="${i}" aria-label="빼기">×</button></span>`}).join('')+`<input id="tin" placeholder="${d.tags.length?'':'태그 입력'}" autocomplete="off">`;
 const inp=box.querySelector('input');inp.value=keep;let hi=-1,items=[];
 const close=()=>{box.parentNode.querySelector('.tls')?.remove()};
 /* 목록: 같은 이름 → 앞글자가 같은 것 → 작품 수 순. 타이핑 중이면 첫 줄이 골라져 있음(공용 고르기 칸과 같게) */
 const show=keepHi=>{close();const raw=inp.value.trim(),v=raw.toLowerCase(),has=new Set(d.tags.filter(x=>typeof x==='string'));
  let L=sortT().filter(t=>!has.has(t.id)&&(!v||t.name.toLowerCase().includes(v)));
  if(v)L.sort((a,b)=>{const A=a.name.toLowerCase(),B=b.name.toLowerCase();return (B===v)-(A===v)||B.startsWith(v)-A.startsWith(v)});
  const exact=S.tags.some(t=>t.name.toLowerCase()===v)||d.tags.some(x=>x.n&&x.n.toLowerCase()===v);
  items=L.map(t=>({t}));if(v&&!exact)items.push({n:raw});
  if(!keepHi)hi=v&&items.length?0:-1;if(hi>=items.length)hi=items.length-1;
  if(!items.length)return;
  const el=document.createElement('div');el.className='tls';
  el.innerHTML=items.map((x,i)=>x.t?`<div data-i="${i}" class="${i===hi?'hi':''}">${E(x.t.name)}<small>${cnt(x.t)}</small></div>`:`<div data-i="${i}" class="new${i===hi?' hi':''}">＋ 새 태그 「${E(x.n)}」</div>`).join('');
  el.addEventListener('mousedown',e=>{e.preventDefault();const r=e.target.closest('[data-i]');if(r)choose(items[+r.dataset.i])});
  box.parentNode.appendChild(el);el.querySelector('.hi')?.scrollIntoView({block:'nearest'})};
 const choose=x=>{if(!x)return;if(x.t){if(!d.tags.includes(x.t.id))d.tags.push(x.t.id)}else addDraftTag(x.n);inp.value='';drawTbx();$('#tin')?.focus()};
 inp.addEventListener('focus',()=>show());
 inp.addEventListener('blur',()=>setTimeout(close,120));
 inp.addEventListener('input',()=>show());
 inp.addEventListener('keydown',e=>{if(e.isComposing)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;const n=items.length;hi=hi<0?(e.key==='ArrowDown'?0:n-1):(hi+(e.key==='ArrowDown'?1:n-1))%n;show(true)}
  else if(e.key==='Enter'||e.key===','){e.preventDefault();const v=inp.value.trim();if(!v)return;
   if(hi>=0&&items[hi])choose(items[hi]);else{addDraftTag(v);inp.value='';drawTbx();$('#tin')?.focus()}}
  else if(e.key==='Escape'){if(box.parentNode.querySelector('.tls')){e.stopPropagation();close()}}
  else if(e.key==='Backspace'&&!inp.value&&d.tags.length){d.tags.pop();drawTbx();$('#tin')?.focus()}});
 box.onclick=e=>{const r=e.target.closest('[data-ri]');if(r){d.tags.splice(+r.dataset.ri,1);drawTbx();$('#tin')?.focus();return}if(e.target===box)inp.focus()}}

/* ---------- 로그인 ---------- */
async function show(){const on=!!Core.ses();$('#login').hidden=on;$('#app').hidden=!on;if(!on)return;
 try{await load()}catch(e){toast(e.message);if(/로그인/.test(e.message)){await Core.logout();show()}}}
$('#go').onclick=async()=>{$('#lmsg').textContent='';try{await Core.login($('#lem').value.trim(),$('#lpw').value);show()}catch(e){$('#lmsg').textContent=e.message}};
$('#lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=async()=>{if(dirty()&&!confirm('저장하지 않은 내용이 있어요. 버리고 로그아웃할까요?'))return;S.ed=null;await Core.logout();location.reload()};
$('#rld').onclick=()=>location.reload();

/* 📲 설치: 크롬이 허락하면 바로 설치, 아니면 방법 안내. 설치된 앱으로 열면 숨김 */
let dp=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
$('#inst').hidden=standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>{dp=null;$('#inst').hidden=true});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;return}
 let had=false;try{had=navigator.getInstalledRelatedApps&&(await navigator.getInstalledRelatedApps()).length>0}catch(e){}
 alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'아이폰: 사파리 아래 공유 버튼 → "홈 화면에 추가"를 누르세요.'
  :(had?'shsh가 이미 이 기기에 설치돼 있어요.\n':'')+'지금은 바로 설치할 수 없어요.\n이미 깔려 있다면 기존 shsh를 지우고 이 페이지를 새로고침하면 설치 버튼이 동작해요.\n또는 크롬 메뉴(⋮) → "앱 설치"를 눌러도 돼요.')};
if(window.Core)show();else{$('#login').hidden=false;$('#lmsg').textContent='공용 파일(core)을 불러오지 못했어요. 새로고침해 주세요.'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
